<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Find It Funded</title>

  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      font-family: "DM Sans", Arial, sans-serif;
      background: #020617;
      color: #ffffff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      max-width: 760px;
      text-align: center;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 30px;
      padding: 46px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
    }

    p:first-child {
      color: #facc15;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 0.14em;
      font-size: 12px;
    }

    h1 {
      font-size: clamp(38px, 6vw, 58px);
      line-height: 1;
      margin: 18px 0;
    }

    .text {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    a {
      display: inline-block;
      background: #facc15;
      color: #020617;
      padding: 16px 28px;
      border-radius: 16px;
      font-weight: 900;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p>Application Received</p>
    <h1>Thank You. We Received Your Property Request.</h1>
    <p class="text">
      A Find It Funded team member will review your submission and contact you soon.
      Make sure your phone is available so we can move quickly.
    </p>
    <a href="./index.html">Back To Home</a>
  </main>
</body>
</html>
